# Pick'em API — Cloudflare Worker config.
# Deploy: see README.md in this directory (one-time, ~10 minutes).
name = "wpr-pickem"
main = "worker.js"
compatibility_date = "2026-06-01"

# KV namespace binding. `npx wrangler kv namespace create PICKS` prints
# the id — paste it below before the first deploy.
[[kv_namespaces]]
binding = "PICKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# --- Per-tenant overrides (white-label deployments) -------------------
# Unset = the WPR production defaults baked into worker.js. A second
# publisher's deployment sets both:
#
# [vars]
# DATA_ORIGIN = "https://<user>.github.io/<repo>"        # where games.json lives
# ALLOWED_ORIGINS = "https://<user>.github.io,https://<news-site>.com"  # comma-separated
