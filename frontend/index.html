<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Central Wisconsin High School Sports — Wausau Pilot &amp; Review</title>

    <!-- The description and the Open Graph / Twitter card tags are injected
         at build time from src/config/site.js by the socialTags() plugin in
         vite.config.js, so the copy lives in one place. Don't add them here
         too — you'd get duplicates. -->

    <!-- Letter-free mark, so a white-label tenant can keep it. Swapping it is
         one file; see docs/white-label.md. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Production renders the light theme (--paper is #ffffff), so the
         browser chrome should match the page ground, not the old dark value. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Fonts are self-hosted (public/fonts/, @font-face in styles/global.css)
         — no Google Fonts round trip, no Cloudflare Fonts rewrite. Preload only
         the three faces above the fold: Oswald, Merriweather 400, and the
         400 italic the hero's venue/mascot line uses (left to CSS discovery it
         landed at 4.8 s, after everything else). Merriweather 700 loads on
         first use. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/oswald-latin-wght.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/merriweather-latin-400.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/merriweather-latin-400italic.woff2"
      crossorigin
    />

    <!-- Vite's `base` (BASE_PATH repo var; "/" on the custom domain,
         "/wpr-prep-sports/" by default), exposed so the prefetch below can
         build the same data URL src/data/fetchDataset.js does. %BASE_URL% is
         replaced by Vite's HTML env substitution at build time. -->
    <meta name="wpr-data-base" content="%BASE_URL%" />

    <!-- Start the dataset's first request (meta.json) now, so it overlaps the
         JS download instead of waiting for the bundles to parse. Computes the
         exact URL fetchDataset() would — <base>/data[/archive/<season>]/
         <sport>/meta.json, season from ?season= or the sessionStorage key
         utils/season.js writes — and parks the in-flight fetch on
         window.__wprMetaPrefetch = { sport, url, promise } for fetchDataset
         to adopt when its URL matches. Blocking on purpose: it must run
         before the module script is even requested.

         Second link in the chain: as soon as meta.json lands, read its
         last_updated from a clone and start the three required files
         fetchDataset() requests next — schools.json, games.json,
         standings.json, each with the same ?v=<last_updated> cache key —
         parked on window.__wprDataPrefetch[url]. Without this they can't
         start until the bundles have parsed and run (about 1.2 s later on a
         slow connection). fetchDataset adopts each only on an exact URL
         match and fetches normally otherwise, so a sport switch, archive
         season or VITE_DATA_BASE override simply ignores them. -->
    <script>
      (function () {
        try {
          var sport = (location.hash.match(/^#\/([a-z_]+)/) || [])[1] || "football";
          // Legacy #/team/… and #/game/… redirect to the default sport;
          // #/card/… and #/sponsor don't load a sport dataset first.
          if (sport === "team" || sport === "game") sport = "football";
          if (sport === "card" || sport === "sponsor") return;
          var meta = document.querySelector('meta[name="wpr-data-base"]');
          var base = ((meta && meta.content) || "/").replace(/\/$/, "");
          var q = /[?&]season=([^&#]*)/.exec(location.search);
          var season = q ? decodeURIComponent(q[1]) : sessionStorage.getItem("wpr-season-view");
          var dir = /^\d{4}-\d{2}$/.test(season || "") ? "/archive/" + season : "";
          var dataBase = base + "/data";
          var sportBase = dataBase + dir + "/" + sport;
          var url = sportBase + "/meta.json";
          var promise = fetch(url, { cache: "no-store" });
          window.__wprMetaPrefetch = { sport: sport, url: url, promise: promise };
          var store = (window.__wprDataPrefetch = {});
          promise
            .then(function (r) {
              // Clone: fetchMeta reads the body of the original later.
              return r.ok ? r.clone().json() : null;
            })
            .then(function (m) {
              // No timestamp → fetchDataset keys on Date.now(), which can't
              // match, so don't spend the requests.
              if (!m || m.last_updated == null) return;
              var v = "?v=" + encodeURIComponent(m.last_updated);
              [dataBase + "/schools.json", sportBase + "/games.json", sportBase + "/standings.json"].forEach(
                function (u) {
                  var p = fetch(u + v);
                  // Marks a never-adopted failure handled (no console noise);
                  // fetchDataset still sees the rejection and refetches.
                  p.catch(function () {});
                  store[u + v] = p;
                },
              );
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
