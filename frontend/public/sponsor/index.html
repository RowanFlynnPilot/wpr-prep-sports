<!doctype html>
<!-- Fragment-free entry to the media kit: /sponsor/ redirects into the
     hash route. Exists because email clients (Outlook SafeLinks
     especially) strip #fragments from shared links, which sent a real
     prospect to the scoreboard instead of the rate card (2026-08-24).
     Share THIS URL in sales emails:
     https://sports.wausaupilotandreview.com/sponsor/ -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Advertise — Central Wisconsin Prep Sports</title>
    <meta name="robots" content="noindex" />
    <script>
      location.replace(location.origin + location.pathname.replace(/sponsor\/?$/, "") + "#/sponsor");
    </script>
    <meta http-equiv="refresh" content="0;url=../#/sponsor" />
  </head>
  <body>
    <p>Opening the sponsorship page… <a href="../#/sponsor">Continue</a></p>
  </body>
</html>
