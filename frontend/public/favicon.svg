<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prep sports standings mark">
  <!-- Standings/scoreboard mark. Deliberately letter-free so a white-label
       tenant can keep it as-is; colors are the neutral monochrome + press-red
       pair from frontend/src/styles/global.css. -->
  <rect width="64" height="64" rx="13" fill="#111111"/>
  <rect x="13" y="17" width="38" height="7" rx="3.5" fill="#ffffff"/>
  <rect x="13" y="28.5" width="25" height="7" rx="3.5" fill="#cc1818"/>
  <rect x="13" y="40" width="32" height="7" rx="3.5" fill="#ffffff" opacity=".5"/>
</svg>
