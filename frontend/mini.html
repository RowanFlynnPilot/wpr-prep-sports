<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- An iframe module, not a page: keep it out of search results. -->
    <meta name="robots" content="noindex" />
    <title>Prep sports scoreboard — Wausau Pilot &amp; Review</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Fonts are self-hosted (public/fonts/, @font-face in styles/global.css,
         which the mini imports). Preload only Oswald — labels, names and
         scores; Merriweather is just the empty-state sentence and loads on
         first use. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/oswald-latin-wght.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mini/main.jsx"></script>
  </body>
</html>
