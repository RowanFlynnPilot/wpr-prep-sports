name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Repo variables (Settings → Secrets and variables → Actions →
          # Variables). Unset = feature disabled.
          # PLAUSIBLE_DOMAIN → analytics (docs/analytics.md).
          # PICKEM_API → community pick'em worker URL (pickem-api/README.md).
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          VITE_PICKEM_API: ${{ vars.PICKEM_API }}
        run: npm run build

      - name: Stage data alongside frontend
        run: |
          mkdir -p frontend/dist/data
          cp -R data/* frontend/dist/data/ || echo "No data yet"
          # Season archives DO ship since 2026-07: the season selector
          # (utils/season.js) serves archived seasons straight from
          # data/archive/<season>/. ~45MB in the artifact — readers only
          # download the files they actually open.

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
