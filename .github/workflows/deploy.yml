name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Repo variables (Settings → Secrets and variables → Actions →
          # Variables). Unset = the WPR defaults compiled into the app.
          # PLAUSIBLE_DOMAIN → analytics (docs/analytics.md).
          # PICKEM_API → community pick'em worker URL (pickem-api/README.md).
          # BASE_PATH → Pages base path for forks (defaults /wpr-prep-sports/).
          # SPONSOR_EMAIL → media-kit contact (defaults to site config).
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          VITE_PICKEM_API: ${{ vars.PICKEM_API }}
          VITE_BASE: ${{ vars.BASE_PATH }}
          VITE_SPONSOR_EMAIL: ${{ vars.SPONSOR_EMAIL }}
        run: npm run build

      - name: Stage data alongside frontend
        run: |
          mkdir -p frontend/dist/data
          cp -R data/* frontend/dist/data/ || echo "No data yet"
          # Season archives DO ship since 2026-07: the season selector
          # (utils/season.js) serves archived seasons straight from
          # data/archive/<season>/. ~45MB in the artifact — readers only
          # download the files they actually open.

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A failed deploy means committed data never reaches readers — the
  # scrape workflows show green, so without this alert nobody notices.
  alert:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/alert-issue
        with:
          title: "Ops alert: Pages deploy failed"
          body: |
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The site is still serving the LAST successful deploy; committed data
            isn't reaching readers until a deploy goes green. Re-run the workflow
            once the cause is fixed. Triage steps: docs/operations.md.
