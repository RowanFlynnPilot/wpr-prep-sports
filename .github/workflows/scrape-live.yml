name: Scrape Live

# High-frequency live-scores cron — runs during typical game windows
# only. The job is cheap (~10s per sport) and a no-op off-season (the
# live merge returns "0 updates" when nothing's in progress), so the
# cron is safe to leave on year-round.
#
# Schedule covers Central Time game windows (UTC-6 std / UTC-5 DST):
#   Weekday evenings (CT) → 23:00-05:59 UTC (same night + early next-day UTC)
#     – Football Fridays (Aug-Nov), Volleyball (Aug-Oct), Basketball (Nov-Mar)
#   Saturday afternoon + evening (CT) → 18:00 UTC Sat - 05:59 UTC Sun
#     – Basketball/Volleyball tournament days, winter Saturday-night
#       hockey, late playoff rounds
#
# Each fires the live scrape for every sport — sports that aren't
# in-season return empty + no commit; cost is ~60s total wall time.
#
# CRON DELIVERY IS BEST-EFFORT: GitHub load-sheds scheduled runs at
# peak times — Fri Aug 28 2026 the evening window got 2 of ~42 ticks,
# i.e. live scores effectively didn't run during games. Two defenses:
# the "Chain next live run" step below re-dispatches this workflow
# while inside a game window (any single tick that fires sustains
# coverage for the whole evening; workflow_dispatch is not load-shed
# the way schedule is), and the Sentinel counts last night's runs and
# alerts when delivery collapsed.

on:
  schedule:
    - cron: "*/10 23 * * 1,2,3,4,5,6"  # Mon-Sat evening UTC (CT weeknight + Sat)
    - cron: "*/10 0-5 * * 0,2,3,4,5,6" # early UTC = CT late evening, Sun covers Sat night
    - cron: "*/10 18-22 * * 6"         # Saturday afternoon UTC (tournament)
  workflow_dispatch:
    inputs:
      sport:
        description: "Single sport id to run; default runs every sport."
        required: false
        default: ""

# One data-committing run at a time, shared with the full scrape — both
# push to main, and on Friday nights their crons overlap. Queued runs
# collapse to the newest pending, which is exactly right for a */10
# cron: skipping an intermediate tick loses nothing.
concurrency:
  group: data-commits
  cancel-in-progress: false

permissions:
  contents: write
  # actions: write lets the final step dispatch the Deploy workflow.
  # Bot-authored pushes don't trigger downstream workflows (GitHub loop
  # protection), so without this an updated data/ never reaches Pages.
  actions: write
  # issues: write lets the failure tail open an ops-alert issue.
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    # A hung network read must not park a runner for the 360-minute
    # default while holding the data-commits lane on a game night.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live scrape (per-sport)
        id: scrape
        working-directory: scraper
        env:
          # On cron runs we cycle through every sport. On manual dispatch
          # the user can pass a single sport id.
          SPORTS: ${{ github.event.inputs.sport || 'football boys_basketball girls_basketball volleyball boys_hockey girls_hockey boys_soccer girls_soccer' }}
        run: |
          FAILED=""
          for sport in $SPORTS; do
            echo "::group::live $sport"
            if python main.py --sport "$sport" --live; then
              echo "ok: $sport"
            else
              echo "::warning::live failed for $sport — continuing"
              FAILED="$FAILED $sport"
            fi
            echo "::endgroup::"
          done
          echo "failed=${FAILED# }" >> "$GITHUB_OUTPUT"

      # Data gate: structurally broken output must never commit. Fails
      # the run before the commit step (see scripts/validate_data.py
      # for what counts as broken vs. a known soft signal).
      - name: Validate data
        working-directory: scraper
        run: python scripts/validate_data.py

      - name: Commit live updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No live score changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "live: $(date -u +%Y-%m-%dT%H:%MZ)"
            # Rebase-retry, with race losses treated as benign — same
            # logic as scrape.yml's commit step. A live merge that loses
            # the push race is superseded within 10 minutes by the next
            # cron; only a pull failing with NO rebase in progress
            # (network/auth — nobody is pushing) stays a hard error.
            PUSHED=true
            for attempt in 1 2 3; do
              if git push; then break; fi
              if [ "$attempt" = 3 ]; then
                echo "::warning::push rejected 3x — live merge superseded by concurrent runs; skipping (next cron re-merges)"
                PUSHED=false
                break
              fi
              echo "push rejected (attempt $attempt) — rebasing and retrying"
              if ! git pull --rebase; then
                if git rebase --abort 2>/dev/null; then
                  echo "::warning::rebase conflict — live merge computed against pre-race state; skipping push (next cron re-merges)"
                  PUSHED=false
                  break
                fi
                echo "::error::git pull failed with no rebase in progress — network or auth problem, not a data race"
                exit 1
              fi
            done
            echo "pushed=$PUSHED" >> "$GITHUB_OUTPUT"
          fi

      # Bot pushes via GITHUB_TOKEN don't trigger Deploy on their own, so
      # kick it explicitly when there was actually a data change to ship.
      - name: Trigger Deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The dispatch API occasionally returns transient 5xx errors
        # (seen 2026-07-01); retry so a committed data change always ships.
        run: |
          for attempt in 1 2 3; do
            if gh workflow run deploy.yml --ref main; then
              exit 0
            fi
            echo "deploy dispatch failed (attempt $attempt) — retrying in 15s"
            sleep 15
          done
          echo "::error::deploy dispatch failed after 3 attempts"
          exit 1

      # Cron self-defense: GitHub load-sheds `schedule` ticks exactly when
      # Friday-night traffic peaks (see header). While we're inside a game
      # window, re-dispatch this workflow so coverage continues without the
      # scheduler. Guards: only when this wasn't a targeted manual run, only
      # when the merges themselves worked, only inside the window (the chain
      # dies at window end), and only when no other live run is queued or
      # running (that one will chain instead — keeps exactly one chain).
      # No sleep: the ~2-4 min of checkout/setup per run IS the cadence,
      # and sleeping here would hold the data-commits lane hostage.
      - name: Chain next live run
        if: github.event.inputs.sport == '' && steps.scrape.outputs.failed == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          day=$(date -u +%u)   # 1=Mon .. 7=Sun
          hour=$((10#$(date -u +%H)))
          in_window=false
          # Mirrors the cron windows above, in UTC.
          if [ "$hour" -eq 23 ] && [ "$day" -le 6 ]; then in_window=true; fi
          if [ "$hour" -le 5 ] && [ "$day" -ne 1 ]; then in_window=true; fi
          if [ "$hour" -ge 18 ] && [ "$hour" -le 22 ] && [ "$day" -eq 6 ]; then in_window=true; fi
          if [ "$in_window" != "true" ]; then
            echo "outside live window — chain ends here"
            exit 0
          fi
          queued=$(gh run list --workflow=scrape-live.yml --status queued --json databaseId --jq 'length' || echo 0)
          running=$(gh run list --workflow=scrape-live.yml --status in_progress --json databaseId \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID})] | length" || echo 0)
          if [ "${queued:-0}" -gt 0 ] || [ "${running:-0}" -gt 0 ]; then
            echo "another live run is pending — it will carry the chain"
            exit 0
          fi
          echo "in game window — dispatching next live run"
          gh workflow run scrape-live.yml --ref main || echo "::warning::chain dispatch failed — cron remains the fallback"

      # ---- Loud-failure tail (after commit/deploy so good data ships
      # first). The alert-issue action dedupes on an open issue with the
      # same title, so a broken source during a Friday window opens ONE
      # issue, not one per 10-minute run.
      - name: Open ops alert
        if: always() && (failure() || steps.scrape.outputs.failed != '')
        uses: ./.github/actions/alert-issue
        with:
          title: "Ops alert: Scrape Live workflow needs attention"
          body: |
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Sports whose live merge crashed:** ${{ steps.scrape.outputs.failed || 'none (a later step failed — see run log)' }}

            Triage steps: docs/operations.md.

      - name: Fail run on live-scrape crashes
        if: steps.scrape.outputs.failed != ''
        run: |
          echo "::error::live scrape crashed for: ${{ steps.scrape.outputs.failed }}"
          exit 1
