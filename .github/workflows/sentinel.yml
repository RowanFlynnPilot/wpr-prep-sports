name: Sentinel

# Daily freshness watchdog. The scrape workflows alert on their OWN
# failures; this catches the failure mode they can't see — green runs
# that stopped producing data (wipe-guarded source breakage, a cron
# that quietly stopped firing, schedule-skips under GitHub load).
# Stdlib-only script, no pip install: the whole job takes ~10s.

on:
  schedule:
    - cron: "0 14 * * *" # daily 14:00 UTC = 8/9am Central, after the morning scrape
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check in-season data freshness
        run: python scraper/scripts/check_freshness.py

      - name: Open ops alert
        if: failure()
        uses: ./.github/actions/alert-issue
        with:
          title: "Ops alert: sentinel failed — in-season data stale or thin"
          body: |
            The sentinel found an in-season sport with stale data (freshness check)
            or a near-empty dataset (coverage check). The run log says which sport
            and which check.

            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Likely causes, in order: the Scrape workflow failing repeatedly, a WIAA
            markup change making every scrape trip the wipe guard (0 games parsed),
            the scheduled cron not firing, or — for coverage — WIAA simply not having
            published that sport's schedules yet. Triage steps: docs/operations.md.

            If investigation shows the condition is real but external (verified
            against schools.wiaawi.org), record it with an expiry date in
            scraper/config/sentinel_ack.json — the sentinel keeps reporting it
            without failing daily — then close this issue.
