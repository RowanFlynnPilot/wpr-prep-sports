name: Frontend tests

# Browser layout guard — the phone-width check that would have caught
# the September 2026 This Week grid collapse (scores clipped off-screen
# for six days while every data gate stayed green). Starts the Vite dev
# server against the repo's committed data/ and drives it with
# Playwright. Deliberately NOT triggered by data/ commits: the scrape
# lands hourly and the layout does not change with it.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Layout guard
        working-directory: frontend
        env:
          # Serve at the root, as the custom domain does, so the data
          # middleware and the app share one base.
          VITE_BASE: /
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
