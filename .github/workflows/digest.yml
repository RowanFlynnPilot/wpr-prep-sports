name: Weekly Digest

# Saturday-morning newsletter export: build the week's roundup
# (markdown + HTML) from the already-scraped data and commit it to
# data/digest/. Runs after the Friday slate is final; the WPR
# newsletter team grabs data/digest/latest.html from the repo or the
# Pages URL. Safe year-round — the script exits without writing when
# the window has no final games (off-season).

on:
  schedule:
    - cron: "0 13 * * 6" # Saturday 13:00 UTC = 7/8am Central
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Week-ending date (YYYY-MM-DD); defaults to the most recent Friday."
        required: false
        default: ""

# Shares the data-commits group with the scrape workflows — everything
# that pushes to main queues behind whatever is mid-push.
concurrency:
  group: data-commits
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    # Never hold the data-commits lane on a hang (Saturday scrape hours).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Build digest
        working-directory: frontend
        env:
          WEEK_ENDING: ${{ github.event.inputs.week_ending }}
          # The digest's week window is computed in local time and game
          # dates carry Central offsets — on the UTC runner a 7pm Friday
          # kickoff would land in Saturday and slip a week.
          TZ: America/Chicago
        run: |
          if [ -n "$WEEK_ENDING" ]; then
            node scripts/build-digest.mjs --week-ending "$WEEK_ENDING"
          else
            node scripts/build-digest.mjs
          fi

      - name: Commit digest
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digest/
          if git diff --cached --quiet; then
            echo "No digest changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: weekly digest $(date -u +%Y-%m-%d)"
            # Same rebase-retry semantics as the scrape workflows: digest
            # only touches data/digest/, so a real conflict is near
            # impossible — but a failed pull must not leave a rebase in
            # progress burning the remaining attempts.
            for attempt in 1 2 3; do
              if git push; then break; fi
              if [ "$attempt" = 3 ]; then
                echo "::error::push rejected 3x — see run log"
                exit 1
              fi
              echo "push rejected (attempt $attempt) — rebasing and retrying"
              if ! git pull --rebase; then
                git rebase --abort 2>/dev/null || true
                echo "::error::git pull --rebase failed — conflict or network problem"
                exit 1
              fi
            done
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Ship the fresh digest to Pages so latest.html has a stable URL
      # the newsletter team can bookmark.
      - name: Trigger Deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run deploy.yml --ref main; then
              exit 0
            fi
            echo "deploy dispatch failed (attempt $attempt) — retrying in 15s"
            sleep 15
          done
          echo "::error::deploy dispatch failed after 3 attempts"
          exit 1

      # Saturday digest failing = newsletter team ships without the
      # roundup. Weekly cadence means a missed run stays missed for a
      # week — alert it.
      - name: Open ops alert
        if: failure()
        uses: ./.github/actions/alert-issue
        with:
          title: "Ops alert: Weekly Digest failed"
          body: |
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            data/digest/latest.html was NOT refreshed this week. Re-run via
            workflow_dispatch (optionally with week_ending) once fixed.
            Triage steps: docs/operations.md.
