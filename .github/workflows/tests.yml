name: Tests

# Scraper test suite — pure-logic units + saved-fixture parser tests.
# No network access needed (fixtures live in scraper/tests/fixtures/;
# refresh them with scraper/tests/capture_fixtures.py).

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "scraper/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            scraper/requirements.txt
            scraper/requirements-dev.txt

      - name: Install deps
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: scraper
        run: python -m pytest tests -q
