name: Debug Bound
# Temporary diagnostic: what does gobound.com serve a GitHub runner?
# Local machines see 50-158 games on the opening-week scores pages; CI
# has parsed 0 all season. Dispatch-only; delete once answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Bound scores page as the scraper does
        run: |
          URL="https://www.gobound.com/wi/wiaa/fb/2026-27/scores?selectedDate=2026-08-21"
          echo "== plain curl =="
          curl -sS -o body1.html -w "status=%{http_code} size=%{size_download} final=%{url_effective}\n" -L "$URL" || true
          echo "game rows: $(grep -c 'competition' body1.html || true)"
          head -c 600 body1.html; echo
          echo "== browser-UA curl =="
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml" \
            -o body2.html -w "status=%{http_code} size=%{size_download} final=%{url_effective}\n" -L "$URL" || true
          echo "game rows: $(grep -c 'competition' body2.html || true)"
          grep -oE "cloudflare|captcha|challenge|Just a moment|blocked|denied" -i body2.html | sort | uniq -c | head -5 || true
          head -c 600 body2.html; echo
